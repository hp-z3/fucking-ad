name: 🤖 Auto Process Issue to PR

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  convert_issue:
    # Trigger on issues created by human users, skip if PR is already generated
    if: >
      !github.event.issue.pull_request &&
      github.event.sender.login != 'github-actions[bot]' &&
      !contains(github.event.issue.labels.*.name, 'PR已生成')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Parse Issue to YAML Record
        id: parse_issue
        run: |
          python scripts/issue_to_record.py "$GITHUB_EVENT_PATH"

      # Auto-rename issue title to standard format if placeholder or not standardized
      - name: Standardize Issue Title
        if: steps.parse_issue.outputs.brand_name != '' && steps.parse_issue.outputs.brand_name != '未知品牌'
        uses: actions/github-script@v7
        with:
          script: |
            const brand = `${{ steps.parse_issue.outputs.brand_name }}`;
            const host = `${{ steps.parse_issue.outputs.host_name }}` || '应用';
            const standardTitle = `【曝光】${brand} - 在 ${host} 中的不良广告`;
            const currentTitle = context.payload.issue.title || '';
            if (!currentTitle.startsWith(`【曝光】${brand}`) || currentTitle.includes('无需手动修改') || currentTitle.includes('待自动')) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  title: standardTitle
                });
                console.log(`Updated Issue #${context.issue.number} title to: ${standardTitle}`);
              } catch (err) {
                console.warn('Failed to update issue title:', err);
              }
            }

      # Case A: Missing screenshot
      - name: Notify Missing Screenshot
        if: steps.parse_issue.outputs.has_images == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = `⚠️ **已收到案例线索，但缺少现场截图凭据**\n\n为了保证案例档案客观可信，案例建档必须包含至少 1 张现场屏幕截图。\n\n👉 **如何补充**：请点击 Issue 右上角 **Edit**，在内容中直接 \`Ctrl+V\` / \`Command+V\` 粘贴截图，或直接在下方评论区上传图片并保存。更新后机器人将自动为您生成 PR！`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['待补充截图']
            });

      # Case B: Screenshot provided, proceed with build and PR
      - name: Validate Generated Record
        if: steps.parse_issue.outputs.has_images == 'true'
        run: |
          python scripts/lint_data.py

      - name: Rebuild README and Web Portal
        if: steps.parse_issue.outputs.has_images == 'true'
        run: |
          python scripts/build_readme.py
          python scripts/build_site.py

      - name: Create Pull Request for Review
        if: steps.parse_issue.outputs.has_images == 'true'
        uses: peter-evans/create-pull-request@v6
        id: cpr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: record ad offense from Issue #${{ github.event.issue.number }}"
          branch: "auto-record/issue-${{ github.event.issue.number }}"
          delete-branch: true
          title: "🤖 [自动收录] 【曝光】${{ steps.parse_issue.outputs.brand_name }} - 在 ${{ steps.parse_issue.outputs.host_name }} 中的不良广告 (#${{ github.event.issue.number }})"
          body: |
            ### 📢 自动转换案例记录

            - **来源 Issue**: #${{ github.event.issue.number }}
            - **涉事品牌**: ${{ steps.parse_issue.outputs.brand_name }}
            - **载体应用**: ${{ steps.parse_issue.outputs.host_name }}
            - **提交用户**: @${{ github.event.issue.user.login }}
            - **生成文件**: `data/records/${{ steps.parse_issue.outputs.record_file }}`
            - **已同步构建**: `README.md` 与 `docs/` 在线检索站

            请维护者核实截图证据后，点击 **Merge pull request** 即可一键收录发布！
          labels: |
            自动收录
            待合并

      - name: Comment on Issue
        if: steps.parse_issue.outputs.has_images == 'true' && steps.cpr.outputs.pull-request-number
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = ${{ steps.cpr.outputs.pull-request-number }};
            const commentBody = `🎉 **感谢你的曝光发声！**\n\n机器人已自动将你的提交转换为结构化数据档案，并创建了合并请求：#${prNum}。\n\n维护团队将在核实截图证据后点击合并，届时主页和 [在线避雷检索站](https://hp-z3.github.io/fucking-ad/) 将自动更新上线！`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['PR已生成']
            });
            // Try removing 待补充截图 if it was previously attached
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: '待补充截图'
              });
            } catch (e) {}

      - name: Alert on Permission / Execution Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = `⚠️ **自动化建档遇到权限或配置问题**\n\nGitHub Actions 执行未完成。如果是首次运行，通常是因为仓库未开放 Actions 写入或 PR 创建权限：\n\n1. 进入仓库 **Settings -> Actions -> General**\n2. 滚动至 **Workflow permissions**，勾选 **Read and write permissions**\n3. 必须勾选 **Allow GitHub Actions to create and approve pull requests** 并保存。\n\n配置完成后，点击本 Issue 右上角 **Edit** 并直接保存，即可重新触发！`;
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            } catch (e) {
              console.error(e);
            }
