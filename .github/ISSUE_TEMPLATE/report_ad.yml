name: 📢 提交流氓广告/诱导跳转案例
description: 客观留存移动端流氓弹窗、摇一摇误触或诱导跳转案例（无需手动改标题）
title: "【曝光案例提报】（提交后系统将自动重命名，无需手动修改）"
labels: ["待审核", "广告曝光"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🛡️ 感谢你为改善移动互联网使用体验提供客观样本！
        > 💡 **标题无需修改**：上方标题框保留默认即可，提交后 GitHub Actions 机器人将自动提取【品牌名称】与【宿主APP】重命名规范标题。
        > 📸 **铁证留存**：请在下方【现场截图】一栏中**直接 Ctrl+V / Command+V 粘贴屏幕截图**（无图无法建档）。提交后自动生成 PR 并同步到 [在线避雷检索站](https://hp-z3.github.io/fucking-ad/)。

  - type: input
    id: advertiser_name
    attributes:
      label: 🚫 涉事广告主 / 品牌名称
      description: 弹窗推广的具体品牌或产品是什么？（例如：拼多多、某某分期、某某二手车）
      placeholder: 如：拼多多
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 🏷️ 广告业务品类
      description: 选择该广告所属的行业品类
      options:
        - 电商购物
        - 金融借贷
        - 社交娱乐
        - 网络游戏
        - 二手车/房产
        - 生活服务
        - 工具清理
        - 在线教育/培训
        - 医疗健康/保健
        - 其他
    validations:
      required: true

  - type: input
    id: host_app
    attributes:
      label: 📲 载体宿主 APP 及平台
      description: 哪个 APP 作为载体弹出了该广告？运行在什么系统？
      placeholder: 如：酷狗音乐 (iOS) 或 万年历 (Android)
    validations:
      required: true

  - type: input
    id: host_version
    attributes:
      label: 🔢 宿主 APP 版本号（留档定责）
      description: 请查看该 APP 的「我的/设置 -> 关于」中的具体版本号（如：v12.0.1）
      placeholder: 如：12.0.1 或 8.9.30
    validations:
      required: false

  - type: input
    id: incident_date
    attributes:
      label: 📅 事发捕获日期（时间存据）
      description: 发生该流氓弹窗的具体日期（格式 YYYY-MM-DD，留空则默认今天）
      placeholder: 如：2026-09-17（留空自动使用今天）
    validations:
      required: false

  - type: checkboxes
    id: offense_type
    attributes:
      label: 🛠️ 涉及的骚扰与流氓手法（多选）
      options:
        - label: 摇一摇跳转（微小晃动或走路即强行唤醒外部APP）
        - label: 假关闭按钮/像素级诱导（按钮极小、难以点击或点击即触发下载）
        - label: 扭一扭/倾斜手机跳转（传感器灵敏度超常）
        - label: 伪装系统通知/微信红包/到账提醒（欺骗性视觉元素）
        - label: 开屏广告/全屏强制遮罩
        - label: 无法关闭/强制倒计时
        - label: 自动下载/静默调起安装
        - label: 应用内浮窗/流氓悬浮物
        - label: 恐吓欺诈/假冒系统清理通知
        - label: 隐蔽扣费/诱导开通
        - label: 其他不体面的交互行为

  - type: textarea
    id: description_and_evidence
    attributes:
      label: 📷 现场截图（必要凭据）与事发说明
      description: 必须附上客观截图！请直接在此处【Ctrl+V 粘贴】或【拖拽】上传屏幕截图（无图不予收录），并简要说明触发情境。
      placeholder: 必须直接在此处粘贴或拖入屏幕截图！并简要说明事发情境（如：走路手腕微晃直接唤醒外部APP，关闭按键延迟3秒才显示）...
    validations:
      required: true

  - type: input
    id: host_alternatives
    attributes:
      label: 💡 推荐体面替代软件（选填）
      description: 有没有能够替代该宿主 APP 的干净、开源好软件推荐？
      placeholder: 如：椒盐音乐、几何天气、开源日历 Simple Calendar
    validations:
      required: false
